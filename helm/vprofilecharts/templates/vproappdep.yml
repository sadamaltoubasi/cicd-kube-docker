apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels: 
    app: vproapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
      - name: vproapp
        image: {{ .Values.appimage}}
        ports:
        - name: vproapp-port
          containerPort: 8080
        volumeMounts:
        - name: efs-uploads
          mountPath: /usr/local/tomcat/webapps/ROOT/uploads
          subPath: uploads
      
      volumes:
      - name: efs-uploads
        persistentVolumeClaim:
          claimName: app-efs-pvc

      initContainers:
      - name: fix-efs-permissions
        image: busybox
        command: ["sh", "-c", "mkdir -p /usr/local/tomcat/webapps/ROOT/uploads && chmod -R 777 /usr/local/tomcat/webapps/ROOT/uploads"]
        volumeMounts:
        - name: efs-uploads
          mountPath: /usr/local/tomcat/webapps/ROOT/uploads
          subPath: uploads

      - name: init-mydb
        image: busybox
        command: ['sh', '-c', 'until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;']
      
      - name: init-mq
        image: busybox
        command: ['sh', '-c', 'until nslookup vpromq01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;']

      - name: init-memcache
        image: busybox
        command: ['sh', '-c', 'until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;']
